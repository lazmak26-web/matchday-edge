const EZ={oc:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};

const FADE=.4; window.DURATION=73.6;
function zoomRect(r){ // keep panel aspect: scale by the larger side, centre on the rect

  const x0=cl(cx-m/2,0,1-m), y0=cl(cy-m/2,0,1-m); return {s:1/m,x0,y0};
}
window.renderFrame=function(T){

    const on=T>=sc.t0&&T<sc.t1; sc.el.style.visibility=on?'visible':'hidden';
    if(!on){sc.el.style.opacity=0;continue;}
    const lp=T-sc.t0; sc.el.style.opacity=sc.t0===0?1:EZ.io(cl(lp/FADE));
    sc.el.querySelectorAll('.a').forEach(el=>{
